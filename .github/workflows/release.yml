name: Build & release

# Every push builds and tests the app and uploads Stashbar.dmg as an artifact.
# A push to main whose version (app/Resources/Info.plist → CFBundleShortVersionString)
# has no release yet publishes release v<version> with the DMG. Pushing a v* tag
# does the same. The website's /download link always serves the latest release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Test
        working-directory: app
        run: swift test

      - name: Decide version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" app/Resources/Info.plist)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then publish=true
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]] && ! gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $v · publish $publish"

      - name: Build app + DMG
        working-directory: app
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
        run: ./scripts/build_app.sh --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Stashbar-dmg
          path: app/build/Stashbar.dmg

      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Stashbar ${{ steps.ver.outputs.version }}
          make_latest: true
          files: app/build/Stashbar.dmg
          generate_release_notes: true
