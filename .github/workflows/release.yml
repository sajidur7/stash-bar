name: Build & release

# Every push builds and tests the app. Pushing a tag like v2.0.0 also builds
# Stashbar.dmg and attaches it to a GitHub Release — the website's /download
# link always points at the latest one.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Test
        working-directory: app
        run: swift test

      - name: Build app + DMG
        working-directory: app
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          BUILD_NUMBER: ${{ github.run_number }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
        run: |
          export VERSION="${VERSION#v}"
          ./scripts/build_app.sh --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Stashbar-dmg
          path: app/build/Stashbar.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/Stashbar.dmg
          generate_release_notes: true
